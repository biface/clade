# =============================================================================
# .gitlab-ci.yml — CI/CD pipeline for django-clade
# =============================================================================
#
# Pipeline structure
# ──────────────────
#   quality       Lint, type-check, security analysis    every push + MR
#   test          pytest matrix (Django 5.2 × py310–313) every push + MR, after quality
#   test          integration-ci (PostgreSQL + ltree)     version tags + schedule
#   build         version check + package build           version tags only, after quality + test + integration-ci
#   publish       TestPyPI (rc tags) / PyPI (final tags)  after build
#
# Release creation (DD-010 Stage 1): manual via GitLab UI.
# Automated release-cli job deferred to Stage 2 (v0.5.0).
#
# Django version matrix
# ─────────────────────
#   v0.1.0 → v0.8.0  Django 5.2 LTS only   Python 3.10–3.13
#   v0.9.0            Django 5.2 + 6.x      Python 3.12–3.14  (djlatest, see below)
#   v1.0.0            Django 5.2 + 6.x      Python 3.12–3.14
#
# Database services
# ─────────────────
#   v0.1.0 → v0.2.0  SQLite in-memory (pytest-django DATABASES setting)
#   v0.3.0 →          PostgreSQL service required (ltree backend)
#                     → Uncomment the `services:` block in .test_base
#
# Required CI/CD variables (Settings → CI/CD → Variables)
# ────────────────────────────────────────────────────────
#   CODECOV_TOKEN        masked, NOT protected (inject in all pipelines)
#   PYPI_API_TOKEN       masked, protected     (inject on protected tags v* only)
#   TEST_PYPI_API_TOKEN  masked, protected     (inject on protected tags v* only)
#
# =============================================================================

stages:
  - quality
  - test
  - build
  - publish

# ─── Shared templates ─────────────────────────────────────────────────────────

# Base image: python:3.12 full (not slim).
# Reason: Pyright requires libatomic1, absent from python:*-slim images.
.tox_setup:
  image: python:3.12
  before_script:
    - pip install --quiet uv
    - uv pip install --system tox tox-uv
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip/
    policy: pull-push

# ─── Shared rule sets ─────────────────────────────────────────────────────────

# Every push on any branch, and every merge request event.
.rules_on_push:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Any version tag: final (v0.2.0) or release candidate (v0.2.0rc1).
.rules_any_version_tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(rc\d+)?$/'

# Release candidates only (v0.2.0rc1, v0.3.0rc2, …).
.rules_rc_tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+rc\d+$/'

# Final releases only (v0.2.0, v0.3.0, …) — no rc suffix.
.rules_final_tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ─── Stage: quality ───────────────────────────────────────────────────────────
# Runs on every push and MR. All five jobs run in parallel.
# Tool names mirror the ndict-tools tox environment names exactly.

.quality_base:
  extends:
    - .tox_setup
    - .rules_on_push
  stage: quality

basedpyright:
  extends: .quality_base
  script:
    - tox -e basedpyright

flake8:
  extends: .quality_base
  script:
    - tox -e flake8
  artifacts:
    name: "flake8-report-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - .tox/flake8/log/
    expire_in: 30 days

black-check:
  extends: .quality_base
  script:
    - tox -e black-check

isort-check:
  extends: .quality_base
  script:
    - tox -e isort-check

bandit:
  extends: .quality_base
  script:
    - tox -e bandit

# ─── Stage: test ──────────────────────────────────────────────────────────────
# Runs on every push and MR, after the quality stage has passed.
# Each job targets a specific Python interpreter; Django 5.2 LTS is implicit
# in the tox environment definition (pyproject.toml).
#
# Framework integration
# ─────────────────────
# pytest-django reads DJANGO_SETTINGS_MODULE from pyproject.toml
# ([tool.pytest.ini_options]). No explicit env var is required here.
#
# TODO v1.0.0 — PostgreSQL service (scheduled integration pipeline only)
# The push pipeline always uses SQLite (standard tests, see DD-011).
# This block is activated at v1.0.0 in a dedicated scheduled job on main,
# not here. Do not uncomment in the push pipeline.

.test_base:
  extends:
    - .rules_on_push
  stage: test
  needs:
    - basedpyright
    - flake8
    - black-check
    - isort-check
    - bandit
  before_script:
    - pip install --quiet uv
    - uv pip install --system tox tox-uv
  # ── TODO v1.0.0: PostgreSQL service (integration-ci scheduled pipeline) ──
  # Activated at v1.0.0 in the dedicated integration-ci job below (DD-011).
  # Never uncomment here — the push pipeline always uses SQLite.
  #
  # services:
  #   - postgres:16-alpine
  #
  # variables:
  #   POSTGRES_DB:       clade_test
  #   POSTGRES_USER:     clade
  #   POSTGRES_PASSWORD: clade
  #   POSTGRES_HOST:     postgres
  #   DATABASE_URL:      "postgresql://clade:clade@postgres/clade_test"
  # ─────────────────────────────────────────────────────────────────────────

# Django 5.2 LTS — Python 3.10
test-py310:
  extends: .test_base
  image: python:3.10
  script:
    - tox -e py310

# Django 5.2 LTS — Python 3.11
test-py311:
  extends: .test_base
  image: python:3.11
  script:
    - tox -e py311

# Django 5.2 LTS — Python 3.12
test-py312:
  extends: .test_base
  image: python:3.12
  script:
    - tox -e py312
  after_script:
    # Upload partial coverage to Codecov (flag: python version).
    # Codecov waits for after_n_builds reports before publishing the final result
    # (configured in .codecov.yml: after_n_builds: 2, one per uploading job).
    - pip install --quiet codecov-cli
    - codecovcli upload-process --git-service gitlab --flag py312 || true

# Django 5.2 LTS — Python 3.13
test-py313:
  extends: .test_base
  image: python:3.13
  script:
    - tox -e py313
  after_script:
    - pip install --quiet codecov-cli
    - codecovcli upload-process --git-service gitlab --flag py313 || true

# Migration validation — MR targeting staging branch only (DD-011)
# Runs the full Django migration machinery (no --no-migrations).
# Guarantees migrations are correct before reaching production.
migrations:
  extends:
    - .tox_setup
  stage: test
  image: python:3.12
  needs:
    - basedpyright
    - flake8
    - black-check
    - isort-check
    - bandit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^staging/'
  script:
    - tox -e migrations

# ── TODO v0.9.0: Django 6.x environments (djlatest) ─────────────────────────
# Activate at v0.9.0 by uncommenting these jobs and their counterparts in
# pyproject.toml ([tool.tox] env_list) and .tox-config/versions.txt.
# Python 3.14 is experimental — allow_failure: true is intentional.
#
# test-py312-djlatest:
#   extends: .test_base
#   image: python:3.12
#   script:
#     - tox -e py312-djlatest
#
# test-py313-djlatest:
#   extends: .test_base
#   image: python:3.13
#   script:
#     - tox -e py313-djlatest
#
# test-py314-djlatest:
#   extends: .test_base
#   image: python:3.14-rc
#   allow_failure: true
#   script:
#     - tox -e py314-djlatest
# ─────────────────────────────────────────────────────────────────────────────

# ── integration-ci — PostgreSQL integration tests ────────────────────────────
# Runs on every version tag (final and rc) and on scheduled pipelines.
#
# Trigger on tags  : validates ltree backend before any PyPI publication.
# Trigger on schedule : ongoing quality gate on main (activate at v1.0.0,
#                       CI/CD → Schedules, targeting main branch).
#
# Requires: CLADE_DB_PASSWORD (masked, NOT protected — Settings → CI/CD → Variables)
# Uses: tox -e integration-ci (settings_integration.py, password via env var)
# Refs: DD-003 (#3), DD-011 (#32), DD-015
#
# PostgreSQL setup
# ────────────────
# The ltree extension must be enabled on the test database template.
# Django clones template1 to create test_clade_test — ltree is inherited.
# postgresql-client is installed in before_script (lightweight, keeps python:3.12
# as the base image consistent with the rest of the pipeline).

integration-ci:
  stage: test
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(rc\d+)?$/'
  needs:
    - basedpyright
    - flake8
    - black-check
    - isort-check
    - bandit
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB:                clade_test
    POSTGRES_USER:              clade_dev
    POSTGRES_PASSWORD:          "$CLADE_DB_PASSWORD"
    POSTGRES_HOST_AUTH_METHOD:  trust
    CLADE_DB_HOST:              postgres
    CLADE_DB_USER:              clade_dev
    CLADE_DB_NAME:              clade_test
    CLADE_DB_PASSWORD:          "$CLADE_DB_PASSWORD"
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - pip install --quiet uv
    - uv pip install --system tox tox-uv
    # Enable ltree on template1 so Django inherits it when cloning the test database.
    # Requires the postgres superuser — trust auth allows passwordless connection.
    - psql -h postgres -U clade_dev -d template1
      -c "CREATE EXTENSION IF NOT EXISTS ltree;"
    # Also enable on clade_test for completeness.
    - psql -h postgres -U clade_dev -d clade_test
      -c "CREATE EXTENSION IF NOT EXISTS ltree;"
  script:
    - tox -e integration-ci
# ─────────────────────────────────────────────────────────────────────────────

# ─── Stage: build ─────────────────────────────────────────────────────────────
# Runs on version tags only (final and rc), after quality + test have passed.
# Checks version consistency across tag, pyproject.toml, and __init__.py,
# then produces the source and wheel distributions.

build:
  extends: .rules_any_version_tag
  stage: build
  image: python:3.12
  needs:
    - basedpyright
    - flake8
    - black-check
    - isort-check
    - bandit
    - test-py310
    - test-py311
    - test-py312
    - test-py313
    - integration-ci
  before_script:
    - pip install build packaging
  script:
    # ── Version consistency check ─────────────────────────────────────────
    - |
      python - <<'EOF'
      import sys, os, re, tomllib
      from pathlib import Path
      from packaging import version as pkg_version

      tag = os.environ["CI_COMMIT_TAG"].lstrip("v")

      with open("pyproject.toml", "rb") as f:
          pyproject_ver = tomllib.load(f)["project"]["version"]

      # __init__.py version is optional — not all Django apps expose it.
      init_ver = None
      for init_file in Path("src").rglob("__init__.py"):
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init_file.read_text())
          if m:
              init_ver = m.group(1)
              break

      errors = []
      if pkg_version.parse(tag) != pkg_version.parse(pyproject_ver):
          errors.append(f"Tag ({tag}) != pyproject.toml ({pyproject_ver})")
      if init_ver and pkg_version.parse(tag) != pkg_version.parse(init_ver):
          errors.append(f"Tag ({tag}) != __init__.py ({init_ver})")

      if errors:
          for e in errors:
              print(f"ERROR: {e}", file=sys.stderr)
          sys.exit(1)

      print(f"✅ Version consistent: {tag}")
      print(f"   pyproject.toml : {pyproject_ver}")
      if init_ver:
          print(f"   __init__.py    : {init_ver}")
      EOF
    # ── Build sdist + wheel ───────────────────────────────────────────────
    - python -m build
    - echo "--- dist/ ---" && ls -lh dist/
  artifacts:
    name: "dist-$CI_COMMIT_TAG"
    paths:
      - dist/
    expire_in: 7 days

# ─── Stage: publish ───────────────────────────────────────────────────────────

# Publish to TestPyPI — release candidates only (v0.2.0rc1, …)
# Requires: TEST_PYPI_API_TOKEN (masked + protected, Settings → CI/CD → Variables)
publish-testpypi:
  extends: .rules_rc_tag
  stage: publish
  image: python:3.12
  needs: [build]
  before_script:
    - pip install --quiet uv
  script:
    # Guard: skip if this version is already published.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      if curl -sf "https://test.pypi.org/pypi/django-clade/${VERSION}/json" > /dev/null 2>&1; then
        echo "✅ django-clade==${VERSION} already on TestPyPI — skipping."
        exit 0
      fi
    - uv publish dist/* --publish-url https://test.pypi.org/legacy/ --token "$TEST_PYPI_API_TOKEN"
    # Availability check (max 5 minutes).
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      MAX=20
      for i in $(seq 1 $MAX); do
        printf "Attempt %d/%d…\n" "$i" "$MAX"
        curl -sf "https://test.pypi.org/pypi/django-clade/${VERSION}/json" > /dev/null 2>&1 && break
        sleep 15
      done
      echo "✅ django-clade==${VERSION} available on TestPyPI."
  environment:
    name: testpypi
    url: https://test.pypi.org/project/django-clade/

# Publish to PyPI — final releases only (v0.2.0, v0.3.0, …)
# Requires: PYPI_API_TOKEN (masked + protected, Settings → CI/CD → Variables)
publish-pypi:
  extends: .rules_final_tag
  stage: publish
  image: python:3.12
  needs: [build]
  before_script:
    - pip install --quiet uv
  script:
    # Guard: skip if this version is already published.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      if curl -sf "https://pypi.org/pypi/django-clade/${VERSION}/json" > /dev/null 2>&1; then
        echo "✅ django-clade==${VERSION} already on PyPI — skipping."
        exit 0
      fi
    - uv publish dist/* --token "$PYPI_API_TOKEN"
    # Availability check (max 5 minutes).
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      MAX=20
      for i in $(seq 1 $MAX); do
        printf "Attempt %d/%d…\n" "$i" "$MAX"
        curl -sf "https://pypi.org/pypi/django-clade/${VERSION}/json" > /dev/null 2>&1 && break
        sleep 15
      done
      echo "✅ django-clade==${VERSION} available on PyPI."
    - echo "🚀 https://pypi.org/project/django-clade/${CI_COMMIT_TAG#v}/"
  environment:
    name: pypi
    url: https://pypi.org/project/django-clade/

