# =============================================================================
# .gitlab-ci.yml — CI/CD pipeline for django-clade
# =============================================================================
#
# Pipeline structure
# ──────────────────
#   check       Quality analysis (flake8, black, isort, basedpyright, bandit)
#               every push + MR
#   test        pytest matrix (Django 5.2 × py310–313) + migrations
#               every push + MR, after check
#   integrate   PostgreSQL + ltree backend validation
#               version tags + scheduled pipelines
#   cover       Coverage report (py312) + Codecov upload
#               main branch, MR→main, version tags
#   build       Version consistency check + package build
#               version tags only, after check + test + integrate + cover
#   publish     TestPyPI (rc tags) / PyPI (final tags) / GitLab Release (final tags)
#               after build
#
# Release creation (DD-010 Stage 2, activated v0.5.0): automated via
# publish:release (release-cli), reading CHANGELOG.md and running after
# publish:pypi succeeds. Manual creation via the GitLab UI (Stage 1) is no
# longer required for final tags.
#
# Django version matrix
# ─────────────────────
#   v0.1.0 → v0.8.0  Django 5.2 LTS only   Python 3.10–3.13
#   v0.9.0            Django 5.2 + 6.x      Python 3.12–3.14  (djlatest, see below)
#   v1.0.0            Django 5.2 + 6.x      Python 3.12–3.14
#
# Required CI/CD variables (Settings → CI/CD → Variables)
# ────────────────────────────────────────────────────────
#   CODECOV_TOKEN        masked, NOT protected (inject in all pipelines)
#   CLADE_DB_PASSWORD    masked, NOT protected (inject in all pipelines)
#   PYPI_API_TOKEN       masked, protected     (inject on protected tags v* only)
#   TEST_PYPI_API_TOKEN  masked, protected     (inject on protected tags v* only)
#
# =============================================================================

stages:
  - check
  - test
  - integrate
  - cover
  - build
  - publish

# ─── Shared templates ─────────────────────────────────────────────────────────

# Base image: python:3.12 full (not slim).
# Reason: basedpyright requires libatomic1, absent from python:*-slim images.
.tox_setup:
  image: python:3.12
  before_script:
    - pip install --quiet uv
    - uv pip install --system tox tox-uv
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip/
    policy: pull-push

# ─── Shared rule sets ─────────────────────────────────────────────────────────

# Every push on any branch, and every merge request event.
.rules_on_push:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Any version tag: final (v0.3.0) or release candidate (v0.3.0rc1).
.rules_any_version_tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(rc\d+)?$/'

# Release candidates only (v0.3.0rc1, v0.4.0rc2, …).
.rules_rc_tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+rc\d+$/'

# Final releases only (v0.3.0, v0.4.0, …) — no rc suffix.
.rules_final_tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# main branch (push or MR) and version tags.
.rules_main_or_tag:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(rc\d+)?$/'

# ─── Stage: check ─────────────────────────────────────────────────────────────
# Runs on every push and MR. All five jobs run in parallel.
# Tool names mirror the ndict-tools tox environment names exactly.

.check_base:
  extends:
    - .tox_setup
    - .rules_on_push
  stage: check

check:basedpyright:
  extends: .check_base
  script:
    - tox -e basedpyright

check:flake8:
  extends: .check_base
  script:
    - tox -e flake8
  artifacts:
    name: "flake8-report-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - .tox/flake8/log/
    expire_in: 30 days

check:black:
  extends: .check_base
  script:
    - tox -e black-check

check:isort:
  extends: .check_base
  script:
    - tox -e isort-check

check:bandit:
  extends: .check_base
  script:
    - tox -e bandit

# check:docs (#86) — sphinx-build -W via tox -e docs, warnings as errors.
# Verification gate only, no artifact: Read the Docs is the sole publish
# target (DD-017); docs/_build/html is produced locally for proofreading
# and is gitignored. This job answers one question — is the doc still
# valid for an RTD publish — the same way RTD's own fail_on_warning: true
# does, but pre-merge instead of post-merge.
check:docs:
  extends: .check_base
  script:
    - tox -e docs

# ─── Stage: test ──────────────────────────────────────────────────────────────
# Runs on every push and MR, after the check stage has passed.
# Each job targets a specific Python interpreter; Django 5.2 LTS is implicit
# in the tox environment definition (pyproject.toml).
#
# pytest-django reads DJANGO_SETTINGS_MODULE from pyproject.toml
# ([tool.pytest.ini_options]). No explicit env var is required here.
#
# The push pipeline always uses SQLite (standard tests, see DD-011).
# PostgreSQL integration is handled by the dedicated integrate:postgresql job.

.test_base:
  extends: .rules_on_push
  stage: test
  needs:
    - check:basedpyright
    - check:flake8
    - check:black
    - check:isort
    - check:bandit
  before_script:
    - pip install --quiet uv
    - uv pip install --system tox tox-uv

# Django 5.2 LTS — Python 3.10
test:py310:
  extends: .test_base
  image: python:3.10
  script:
    - tox -e py310

# Django 5.2 LTS — Python 3.11
test:py311:
  extends: .test_base
  image: python:3.11
  script:
    - tox -e py311

# Django 5.2 LTS — Python 3.12
test:py312:
  extends: .test_base
  image: python:3.12
  script:
    - tox -e py312

# Django 5.2 LTS — Python 3.13
test:py313:
  extends: .test_base
  image: python:3.13
  script:
    - tox -e py313

# Migration validation — MR targeting staging branch only (DD-011)
# Runs the full Django migration machinery (no --no-migrations).
# Guarantees migrations are correct before reaching production.
test:migrations:
  extends: .tox_setup
  stage: test
  image: python:3.12
  needs:
    - check:basedpyright
    - check:flake8
    - check:black
    - check:isort
    - check:bandit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^staging/'
  script:
    - tox -e migrations

# ── TODO v0.9.0: Django 6.x environments (djlatest) ─────────────────────────
# Activate at v0.9.0 by uncommenting these jobs and their counterparts in
# pyproject.toml ([tool.tox] env_list) and .tox-config/versions.txt.
# Python 3.14 is experimental — allow_failure: true is intentional.
#
# test:py312-djlatest:
#   extends: .test_base
#   image: python:3.12
#   script:
#     - tox -e py312-djlatest
#
# test:py313-djlatest:
#   extends: .test_base
#   image: python:3.13
#   script:
#     - tox -e py313-djlatest
#
# test:py314-djlatest:
#   extends: .test_base
#   image: python:3.14-rc
#   allow_failure: true
#   script:
#     - tox -e py314-djlatest
# ─────────────────────────────────────────────────────────────────────────────

# ─── Stage: integrate ─────────────────────────────────────────────────────────
# PostgreSQL + ltree backend validation.
# Runs on every version tag (final and rc) and on scheduled pipelines.
#
# Trigger on tags     : validates ltree backend before any PyPI publication.
# Trigger on schedule : ongoing quality gate on main (activate at v1.0.0,
#                       CI/CD → Schedules, targeting main branch).
#
# PostgreSQL setup
# ────────────────
# ltree must be enabled on template1 — Django clones it to create test_clade_test.
# trust auth allows the clade_dev superuser to connect without a password.
# postgresql-client installed in before_script (keeps python:3.12 as base image).
#
# Refs: DD-003 (#3), DD-011 (#32), DD-015

integrate:postgresql:
  stage: integrate
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(rc\d+)?$/'
  needs:
    - check:basedpyright
    - check:flake8
    - check:black
    - check:isort
    - check:bandit
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB:                clade_test
    POSTGRES_USER:              clade_dev
    POSTGRES_PASSWORD:          "$CLADE_DB_PASSWORD"
    POSTGRES_HOST_AUTH_METHOD:  trust
    CLADE_DB_HOST:              postgres
    CLADE_DB_USER:              clade_dev
    CLADE_DB_NAME:              clade_test
    CLADE_DB_PASSWORD:          "$CLADE_DB_PASSWORD"
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - pip install --quiet uv
    - uv pip install --system tox tox-uv
    # Enable ltree on template1 — inherited by test_clade_test on clone.
    - psql -h postgres -U clade_dev -d template1
        -c "CREATE EXTENSION IF NOT EXISTS ltree;"
    - psql -h postgres -U clade_dev -d clade_test
        -c "CREATE EXTENSION IF NOT EXISTS ltree;"
  script:
    - tox -e integration-ci

# ─── Stage: cover ─────────────────────────────────────────────────────────────
# Coverage report generation and Codecov upload.
# Runs on main branch (push and MR) and on all version tags.
#
# tox -e coverage runs a full pytest pass with --cov on py312 (coverage-version.txt).
# Produces coverage/coverage.xml uploaded to codecov.io.
# after_n_builds: 1 in .codecov.yml — cover:py312 is the sole upload job.
#
# Refs: DD-006 (#6), DD-009 (#9)

cover:py312:
  extends:
    - .tox_setup
    - .rules_main_or_tag
  stage: cover
  needs:
    - test:py310
    - test:py311
    - test:py312
    - test:py313
  script:
    - tox -e coverage
  after_script:
    - pip install --quiet codecov-cli
    - codecovcli upload-process --git-service gitlab --flag unittests
        --coverage-files-search-root-folder coverage/ || true
  artifacts:
    name: "coverage-$CI_COMMIT_SHORT_SHA"
    paths:
      - coverage/coverage.xml
      - coverage/coverage_html/
    expire_in: 30 days

# ─── Stage: build ─────────────────────────────────────────────────────────────
# Runs on version tags only (final and rc), after all previous stages.
# Checks version consistency across tag, pyproject.toml, and __init__.py,
# then produces the source and wheel distributions.

build:package:
  extends: .rules_any_version_tag
  stage: build
  image: python:3.12
  needs:
    - check:basedpyright
    - check:flake8
    - check:black
    - check:isort
    - check:bandit
    - test:py310
    - test:py311
    - test:py312
    - test:py313
    - integrate:postgresql
    - cover:py312
  before_script:
    - pip install build packaging
  script:
    # ── Version consistency check ─────────────────────────────────────────
    - |
      python - <<'EOF'
      import sys, os, re, tomllib
      from pathlib import Path
      from packaging import version as pkg_version

      tag = os.environ["CI_COMMIT_TAG"].lstrip("v")

      with open("pyproject.toml", "rb") as f:
          pyproject_ver = tomllib.load(f)["project"]["version"]

      # __init__.py version is optional — not all Django apps expose it.
      init_ver = None
      for init_file in Path("src").rglob("__init__.py"):
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init_file.read_text())
          if m:
              init_ver = m.group(1)
              break

      errors = []
      if pkg_version.parse(tag) != pkg_version.parse(pyproject_ver):
          errors.append(f"Tag ({tag}) != pyproject.toml ({pyproject_ver})")
      if init_ver and pkg_version.parse(tag) != pkg_version.parse(init_ver):
          errors.append(f"Tag ({tag}) != __init__.py ({init_ver})")

      if errors:
          for e in errors:
              print(f"ERROR: {e}", file=sys.stderr)
          sys.exit(1)

      print(f"✅ Version consistent: {tag}")
      print(f"   pyproject.toml : {pyproject_ver}")
      if init_ver:
          print(f"   __init__.py    : {init_ver}")
      EOF
    # ── Build sdist + wheel ───────────────────────────────────────────────
    - python -m build
    - echo "--- dist/ ---" && ls -lh dist/
  artifacts:
    name: "dist-$CI_COMMIT_TAG"
    paths:
      - dist/
    expire_in: 7 days

# ─── Stage: publish ───────────────────────────────────────────────────────────

# Publish to TestPyPI — release candidates only (v0.3.0rc1, …)
# Requires: TEST_PYPI_API_TOKEN (masked + protected, Settings → CI/CD → Variables)
publish:testpypi:
  extends: .rules_rc_tag
  stage: publish
  image: python:3.12
  needs: [build:package]
  before_script:
    - pip install --quiet uv
  script:
    # Guard: skip if this version is already published.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      if curl -sf "https://test.pypi.org/pypi/django-clade/${VERSION}/json" > /dev/null 2>&1; then
        echo "✅ django-clade==${VERSION} already on TestPyPI — skipping."
        exit 0
      fi
    - uv publish dist/* --publish-url https://test.pypi.org/legacy/ --token "$TEST_PYPI_API_TOKEN"
    # Availability check (max 5 minutes).
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      MAX=20
      for i in $(seq 1 $MAX); do
        printf "Attempt %d/%d…\n" "$i" "$MAX"
        curl -sf "https://test.pypi.org/pypi/django-clade/${VERSION}/json" > /dev/null 2>&1 && break
        sleep 15
      done
      echo "✅ django-clade==${VERSION} available on TestPyPI."
  environment:
    name: testpypi
    url: https://test.pypi.org/project/django-clade/

# Publish to PyPI — final releases only (v0.3.0, v0.4.0, …)
# Requires: PYPI_API_TOKEN (masked + protected, Settings → CI/CD → Variables)
publish:pypi:
  extends: .rules_final_tag
  stage: publish
  image: python:3.12
  needs: [build:package]
  before_script:
    - pip install --quiet uv
  script:
    # Guard: skip if this version is already published.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      if curl -sf "https://pypi.org/pypi/django-clade/${VERSION}/json" > /dev/null 2>&1; then
        echo "✅ django-clade==${VERSION} already on PyPI — skipping."
        exit 0
      fi
    - uv publish dist/* --token "$PYPI_API_TOKEN"
    # Availability check (max 5 minutes).
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      MAX=20
      for i in $(seq 1 $MAX); do
        printf "Attempt %d/%d…\n" "$i" "$MAX"
        curl -sf "https://pypi.org/pypi/django-clade/${VERSION}/json" > /dev/null 2>&1 && break
        sleep 15
      done
      echo "✅ django-clade==${VERSION} available on PyPI."
    - echo "🚀 https://pypi.org/project/django-clade/${CI_COMMIT_TAG#v}/"
  environment:
    name: pypi
    url: https://pypi.org/project/django-clade/

# ─── DD-010 Stage 2: automated GitLab Release (v0.5.0) ────────────────────────
# Creates the GitLab Release automatically from CHANGELOG.md after publish:pypi
# succeeds. Manual creation via the GitLab UI (Stage 1) is no longer needed
# for final tags.
#
# CHANGELOG.md section extraction (Keep a Changelog format, DD-006/DD-010):
#   "## [X.Y.Z] — YYYY-MM-DD" starts the section; the next "## [" header or a
#   standalone "---" divider ends it. Verified against every existing section
#   (0.0.5 → 0.4.0) before activation — no trailing separator leaks into the
#   Release description.

publish:release:
  extends: .rules_final_tag
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [publish:pypi]
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{if(flag) exit} /^---\$/{if(flag) exit} flag" \
        CHANGELOG.md > release_notes.md
      echo "--- release_notes.md ---" && cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "django-clade $CI_COMMIT_TAG"
    description: "./release_notes.md"
    assets:
      links:
        - name: "PyPI"
          url: "https://pypi.org/project/django-clade/$CI_COMMIT_TAG/"
