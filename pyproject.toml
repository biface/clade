# =============================================================================
# pyproject.toml — django-clade
# Single configuration file for packaging, toolchain and test orchestration.
#
# Toolchain: superset of ndict-tools (DD-009, amended 2026-05-13)
#   Base:   flake8, black, isort, basedpyright, bandit, tox + tox-uv, pytest-cov
#   Django: pytest-django, django~=5.2
#
# Refs: DD-007 (SemVer), DD-008 (Django add-on), DD-009 (toolchain)
# GitLab:
#  https://gitlab.com/open-works/clade/-/issues/7
#  https://gitlab.com/open-works/clade/-/issues/8
#  https://gitlab.com/open-works/clade/-/issues/9
# =============================================================================

# -----------------------------------------------------------------------------
# Build system
# -----------------------------------------------------------------------------
[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clade"]


# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
[project]
name            = "django-clade"
version         = "0.5.0"
description     = "A Django module for managing hierarchical data models through a node tree, with kinship relationship queries and optional database-native optimisations."
readme          = "README.md"
license         = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors         = [
    { name = "biface", email = "fek2qe8i3@mozmail.com" },
]
keywords = [
    "django",
    "clade",
    "tree",
    "ltree",
    "kinship",
    "adjacency",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "django>=5.2",
]

[project.urls]
Repository = "https://gitlab.com/open-works/clade"
Issues     = "https://gitlab.com/open-works/clade/-/issues"
Changelog  = "https://gitlab.com/open-works/clade/-/blob/main/CHANGELOG.md"
Mirror     = "https://github.com/open-works/clade"

[project.optional-dependencies]
dev = [
    # Base toolchain — shared with ndict-tools
    "flake8",
    "black",
    "isort",
    "basedpyright",
    "bandit",
    "tox",
    "tox-uv",
    "pytest",
    "pytest-cov",
    # Django layer — clade only
    "pytest-django",
    "django~=5.2",
]


# -----------------------------------------------------------------------------
# black — code formatting
# Refs: DD-009
# -----------------------------------------------------------------------------
[tool.black]
target-version = ["py310", "py311", "py312", "py313"]
line-length    = 88


# -----------------------------------------------------------------------------
# isort — import sorting
# Refs: DD-009
# -----------------------------------------------------------------------------
[tool.isort]
profile                     = "black"
line_length                 = 88
known_first_party           = ["clade"]
multi_line_output           = 3
include_trailing_comma      = true
force_grid_wrap             = 0
use_parentheses             = true
ensure_newline_before_comments = true


# -----------------------------------------------------------------------------
# basedpyright — type checking (reads from [tool.pyright])
# Refs: DD-009
# -----------------------------------------------------------------------------
[tool.pyright]
include               = ["src/clade"]
pythonVersion         = "3.10"
typeCheckingMode      = "standard"  # strict incompatible with django-stubs partial typing
reportMissingImports  = true
reportMissingTypeStubs = false


# -----------------------------------------------------------------------------
# Bandit — security analysis
# Refs: DD-009
# -----------------------------------------------------------------------------
[tool.bandit]
targets = ["src/clade"]
skips   = ["B101"]


# -----------------------------------------------------------------------------
# pytest — test runner
# Refs: DD-006, DD-009, DD-011, DD-012
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files           = ["test_*.py", "*_test.py"]
python_classes         = ["Test*"]
python_functions       = ["test_*"]
pythonpath             = ["."]
testpaths              = ["tests"]
addopts                = [
    "--strict-markers",
    "--import-mode=importlib",
    "--no-migrations",    # tables created directly from models (fast)
                          # migration validation: tox -e migrations (staging MR)
    "-m", "not integration",  # integration tests require PostgreSQL — run via tox -e integration
    "-v",
]
markers = [
    "django_db: marks tests requiring database access (deselect with '-m not django_db')",
    "integration: marks tests requiring real PostgreSQL — local only until v1.0.0 (DD-011)",
]


# -----------------------------------------------------------------------------
# Coverage
# Refs: DD-006, DD-009
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["clade"]
branch = true
omit   = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing  = true
skip_covered  = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]


# -----------------------------------------------------------------------------
# tox — test orchestration
#
# Environment naming follows ndict-tools convention (DD-009):
#   Quality : basedpyright, flake8, black-check, isort-check, bandit
#   Tests   : py310, py311, py312, py313  (deps from base.django.txt)
#   djlatest: py312-djlatest … py314-djlatest — activated at v0.9.0
#   Extras  : coverage, integration (v0.3.0), pre-push
#
# Scripts shared with ndict-tools (no modification):
#   .tox-config/scripts/test.sh       reads versions.txt
#   .tox-config/scripts/coverage.sh   reads coverage-version.txt
#
# Refs: DD-006, DD-009, DD-011
# -----------------------------------------------------------------------------
[tool.tox]
requires  = ["tox>=4", "tox-uv"]
env_list  = [
    # Quality (parallel in CI, sequential locally)
    "basedpyright",
    "flake8",
    "black-check",
    "isort-check",
    "bandit",
    # Tests — Django 5.2 LTS (v0.1.0 → v0.8.0)
    "py310",
    "py311",
    "py312",
    "py313",
    # Django 6.0+ — activated at v0.9.0
    # "py312-djlatest",
    # "py313-djlatest",
    # "py314-djlatest",
]

# Base for all test environments (py310, py311, py312, py313)
# Quality environments override commands and deps entirely.
# Coverage flags are intentionally absent: coverage is generated
# by tox -e coverage only, not duplicated across all Python versions.
[tool.tox.env_run_base]
runner   = "uv-venv-runner"
setenv   = { DJANGO_SETTINGS_MODULE = "tests.settings" }
deps     = ["-r {toxinidir}/.tox-config/requirements/base.django.txt"]
commands = [
    ["pytest"],
]

# =============================================================================
# Quality environments
# =============================================================================

[tool.tox.env.basedpyright]
description         = "basedpyright — static type checking"
deps                = ["-r {toxinidir}/.tox-config/requirements/type-check.django.txt"]
allowlist_externals = ["bash"]
commands            = [
    # uv-venv-runner installs deps into .venv/bin/ (project venv), which is on PATH.
    # bash inherits that PATH and finds basedpyright there.
    # Exit 0 = ok, 1/2/3 = warnings/errors found; all acceptable.
    # Exit > 3 = tool failure → tox reports failure correctly.
    ["bash", "-c", "basedpyright src; code=$?; [ $code -le 3 ]"],
]

[tool.tox.env.flake8]
description         = "flake8 — lint"
deps                = ["-r {toxinidir}/.tox-config/requirements/linter.txt"]
allowlist_externals = ["flake8"]
commands            = [
    ["flake8",
     "--max-line-length=88",
     "--extend-ignore=E203,W503",
     "--exclude=.tox,.git,__pycache__,build,dist,migrations",
     "--per-file-ignores=tests/*.py:F401,F841,E711,E712 tests/settings.py:S105",
     "src/",
     "tests/"],
]

[tool.tox.env."black-check"]
description         = "black — format check (no changes)"
deps                = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
allowlist_externals = ["black"]
commands            = [
    ["black", "--check", "--diff", "--target-version", "py310", "src/", "tests/"],
]

[tool.tox.env."isort-check"]
description         = "isort — import order check (no changes)"
deps                = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
allowlist_externals = ["isort"]
commands            = [
    ["isort", "--check-only", "--diff", "src/", "tests/"],
]

[tool.tox.env.bandit]
description         = "bandit — security analysis"
deps                = ["-r {toxinidir}/.tox-config/requirements/security.txt"]
allowlist_externals = ["bandit"]
commands            = [
    ["bandit", "-c", "pyproject.toml", "-r", "src/clade"],
]

# =============================================================================
# Test environments — Django 5.2 LTS
# Deps inherited from env_run_base (base.django.txt).
# Commands inherited from env_run_base.
# =============================================================================

[tool.tox.env.py310]
description = "pytest — Python 3.10 × Django 5.2 LTS"
base_python = "python3.10"

[tool.tox.env.py311]
description = "pytest — Python 3.11 × Django 5.2 LTS"
base_python = "python3.11"

[tool.tox.env.py312]
description = "pytest — Python 3.12 × Django 5.2 LTS"
base_python = "python3.12"

[tool.tox.env.py313]
description = "pytest — Python 3.13 × Django 5.2 LTS"
base_python = "python3.13"

# =============================================================================
# Test environments — Django latest (activated at v0.9.0)
# Django 6.0+ does not support Python 3.10 or 3.11.
# =============================================================================

# [tool.tox.env."py312-djlatest"]
# description = "pytest — Python 3.12 × Django latest (6.0+)"
# base_python = "python3.12"
# deps        = ["-r {toxinidir}/.tox-config/requirements/base.django.txt"]

# [tool.tox.env."py313-djlatest"]
# description = "pytest — Python 3.13 × Django latest (6.0+)"
# base_python = "python3.13"
# deps        = ["-r {toxinidir}/.tox-config/requirements/base.django.txt"]

# [tool.tox.env."py314-djlatest"]
# description = "pytest — Python 3.14 × Django latest (6.0+)"
# base_python = "python3.14"
# deps        = ["-r {toxinidir}/.tox-config/requirements/base.django.txt"]

# =============================================================================
# Auto-fix environments (local only — not in CI)
# =============================================================================

[tool.tox.env.black]
description         = "black — auto-format code"
deps                = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
allowlist_externals = ["black"]
commands            = [
    ["black", "--target-version", "py310", "src/", "tests/"],
]

[tool.tox.env.isort]
description         = "isort — auto-sort imports"
deps                = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
allowlist_externals = ["isort"]
commands            = [
    ["isort", "src/", "tests/"],
]

[tool.tox.env.format]
description         = "black + isort — auto-format everything"
deps                = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
allowlist_externals = ["black", "isort"]
commands            = [
    ["black", "--target-version", "py310", "src/", "tests/"],
    ["isort", "src/", "tests/"],
]

# =============================================================================
# Coverage (local + CI)
# =============================================================================

[tool.tox.env.coverage]
description         = "Generate full coverage report (HTML + XML)"
base_python         = "python3.12"
deps                = ["-r {toxinidir}/.tox-config/requirements/base.django.txt"]
allowlist_externals = ["mkdir", "pytest"]
commands            = [
    ["mkdir", "-p", "{toxinidir}/coverage"],
    ["pytest",
     "--cov=clade",
     "--cov-report=term-missing",
     "--cov-report=xml:{toxinidir}/coverage/coverage.xml",
     "--cov-report=html:{toxinidir}/coverage/coverage_html"],
]

# =============================================================================
# Integration tests (local only until v1.0.0 — DD-011)
#
# integration     — local development, credentials in settings_integration_local.py
# integration-ci  — CI pipeline, password injected via CLADE_DB_PASSWORD env var
#
# Refs: DD-011 (#32)
# =============================================================================

[tool.tox.env.integration]
description         = "Integration tests — local (credentials in settings_integration_local.py)"
base_python         = "python3.12"
deps                = ["-r {toxinidir}/.tox-config/requirements/integration.txt"]
setenv              = { DJANGO_SETTINGS_MODULE = "tests.settings_integration_local" }
allowlist_externals = ["bash"]
commands            = [
    ["bash", "-c", "pytest -m integration -v || [ $? -eq 5 ]"],
]

[tool.tox.env.integration-ci]
description         = "Integration tests — CI (password via CLADE_DB_PASSWORD GitLab variable)"
base_python         = "python3.12"
deps                = ["-r {toxinidir}/.tox-config/requirements/integration.txt"]
setenv              = { DJANGO_SETTINGS_MODULE = "tests.settings_integration" }
passenv             = ["CLADE_DB_NAME", "CLADE_DB_USER", "CLADE_DB_PASSWORD", "CLADE_DB_HOST", "CLADE_DB_PORT"]
allowlist_externals = ["bash"]
commands            = [
    ["bash", "-c", "pytest -m integration -v || [ $? -eq 5 ]"],
]

# =============================================================================
# Migration validation (staging MR only — DD-011)
# Runs WITHOUT --no-migrations to exercise the full migration machinery.
# Triggered by the CI migrations job on MR → staging.
# =============================================================================

[tool.tox.env.migrations]
description = "Validate Django migrations — run with full migration machinery"
base_python = "python3.12"
deps        = ["-r {toxinidir}/.tox-config/requirements/base.django.txt"]
commands    = [["pytest", "--migrations"]]

# =============================================================================
# Documentation build (Sphinx + Furo + MyST-Parser)
# `-W` (warnings as errors) intentionally NOT set here -- that's #86's CI
# job (docs:build), once content has stabilised enough to build warning-free.
# Local iteration stays lenient so a missing toctree entry doesn't block
# a work-in-progress build.
#
# Source/build split: docs/source/ holds conf.py and content, docs/_build/
# is the generated output -- kept isolated so _build/ can be gitignored
# without touching the source tree.
#
# Refs: DD-017 (#78), #79, #86
# =============================================================================

[tool.tox.env.docs]
description = "Build Sphinx documentation (docs/source -> docs/_build/html)"
base_python = "python3.12"
deps        = ["-r {toxinidir}/.tox-config/requirements/docs.txt"]
commands    = [["sphinx-build", "-b", "html", "docs/source", "docs/_build/html", "-W"]]

# =============================================================================
# Pre-push local workflow
# Runs the full quality + test + coverage chain before git push.
# =============================================================================

[tool.tox.env.pre-push]
description         = "Full local workflow before push (format + quality + tests + coverage)"
deps                = ["-r {toxinidir}/.tox-config/requirements/full.django.txt"]
allowlist_externals = ["black", "isort", "bash", "basedpyright", "flake8", "bandit"]
passenv             = ["HOME", "USER"]
commands            = [
    # 1. Auto-format
    ["black", "--target-version", "py310", "src/", "tests/"],
    ["isort", "src/", "tests/"],
    # 2. Type checking
    ["bash", "-c", "basedpyright src; code=$?; [ $code -le 3 ]"],
    # 3. Lint
    ["flake8",
     "--max-line-length=88",
     "--extend-ignore=E203,W503",
     "--exclude=.tox,.git,__pycache__,build,dist,migrations",
     "--per-file-ignores=tests/*.py:F401,F841,E711,E712 tests/settings.py:S105",
     "src/",
     "tests/"],
    # 4. Format verification (should always pass after step 1)
    ["black", "--check", "--diff", "--target-version", "py310", "src/", "tests/"],
    ["isort", "--check-only", "--diff", "src/", "tests/"],
    # 5. Security
    ["bandit", "-c", "pyproject.toml", "-r", "src/clade"],
    # 6. Tests (all Python versions, sequential)
    ["bash", "{toxinidir}/.tox-config/scripts/test.sh"],
    # 7. Coverage report
    ["bash", "{toxinidir}/.tox-config/scripts/coverage.sh"],
]
