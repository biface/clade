# =============================================================================
# .codecov.yml — Clade project
# Coverage reporting configuration for codecov.io
#
# Validate: curl -X POST --data-binary @.codecov.yml https://codecov.io/validate
#
# Refs: DD-006 (test strategy), DD-009 (toolchain)
# GitLab: #6, #9
# =============================================================================

# -----------------------------------------------------------------------------
# Coverage targets
# -----------------------------------------------------------------------------
coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: 80%          # minimum acceptable project coverage (DD-006)
        threshold: 1%        # allow 1% drop before reporting a failure
    patch:
      default:
        target: 80%          # new code in each MR must meet the same target
        threshold: 1%

# -----------------------------------------------------------------------------
# Components — coverage by conceptual area (DD-001 to DD-005)
#
# Paths reflect the real flat src/clade/ layout (no subpackages) — this
# repo has always been flat; the original component paths below assumed
# a subpackage structure that never existed and never accrued coverage.
#
# Known overlap (documented, not hidden): since #70, models.py and
# managers.py each contain a small amount of Affinity-related code
# (CladeNode.affinities()/affinities_grouped(), NodeManager's proxies)
# alongside their dominant Node Tree / Kinship content. Component paths
# operate at file granularity — this cannot be split further without
# restructuring the module into subpackages, which is out of scope here.
# -----------------------------------------------------------------------------
component_management:
  default_rules:
    statuses:
      - type: project
        target: 80%
        threshold: 1%

  individual_components:

    - component_id: node_tree
      name: "Node Tree"          # DD-001, DD-012–DD-015 — CladeNode, path, deletion
      paths:
        - "src/clade/models.py"
        - "src/clade/deletion.py"
        - "src/clade/signals.py"

    - component_id: kinship
      name: "Kinship queries"    # DD-002, DD-016 — ancestors, siblings, pibling, cousin…
      paths:
        - "src/clade/managers.py"

    - component_id: backends
      name: "Backends"           # DD-003, DD-015 — ltree + fallback dispatch
      paths:
        - "src/clade/fields.py"

    - component_id: affinity
      name: "Affinity"           # DD-004, DD-005 — lateral shared-attribute grouping
      paths:
        - "src/clade/affinity.py"
        - "src/clade/checks.py"

    - component_id: wiring
      name: "Wiring"             # AppConfig signal/check registration, shared discovery
      paths:
        - "src/clade/apps.py"
        - "src/clade/_discovery.py"

# -----------------------------------------------------------------------------
# Flags — by test type
#
# "unittests" names the *kind* of test (standard SQLite suite), not the
# interpreter that ran it — stays valid if the coverage matrix later grows
# (e.g. a distinct flag for #74's PostgreSQL integration tests). The CI
# job previously uploaded under --flag py312, which never matched this
# declaration — fixed in .gitlab-ci.yml (cover:py312 job) alongside this.
# -----------------------------------------------------------------------------
flags:
  unittests:
    paths:
      - src/clade/
    carryforward: true

# -----------------------------------------------------------------------------
# Ignored paths
# -----------------------------------------------------------------------------
ignore:
  - "src/clade/migrations/**"
  - "tests/**"
  - "docs/**"

# -----------------------------------------------------------------------------
# MR comments
# -----------------------------------------------------------------------------
comment:
  layout: "reach,diff,components,flags,files"
  behavior: default
  require_changes: true

# -----------------------------------------------------------------------------
# Codecov behaviour
# -----------------------------------------------------------------------------
codecov:
  notify:
    after_n_builds: 1    # cover:py312 is the sole upload job
