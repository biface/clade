# =============================================================================
# .readthedocs.yaml — Read the Docs build configuration.
#
# Direct pointing, no pip extra: `docs` dependencies (sphinx, furo,
# myst-parser) come from .tox-config/requirements/docs.txt, the same file
# `tox -e docs` uses locally — one declaration, not two. The project itself
# is installed separately (`pip install .`) to pull in its own base
# dependency (django>=5.2), which docs/source/conf.py needs for
# django.setup() (#80). Resolves the decision left open in docs.txt (#87).
#
# fail_on_warning mirrors the `-W` (warnings-as-errors) discipline of the
# `docs:build` CI job (#86) — a doc build that warns should fail here too.
#
# Refs: DD-017 (#78), #87
# =============================================================================

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
    - requirements: .tox-config/requirements/docs.txt
